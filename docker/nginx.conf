server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Missing JS/CSS must return 404, not the SPA HTML document.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Revalidate the entry document after deployment.
    location = /index.html {
        expires -1;
    }

    # BrowserRouter routes are handled by React after loading index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
